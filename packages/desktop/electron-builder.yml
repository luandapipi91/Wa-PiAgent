appId: ai.wa-pi.desktop
productName: WA PI Agent
artifactName: "WaPi-Setup-${version}.${ext}"
npmRebuild: false
afterPack: scripts/after-pack.cjs
afterAllArtifactBuild: scripts/after-all-artifact-build.cjs
# 自动更新源：Cloudflare R2 自定义域名（oss.wapiagent.top → R2 bucket 公开读）。
# 打包时据此生成 latest.yml（含 version/sha512/path）。
# releaseNotes 由 publish-oss.ts 上传前从 version-history.json 读取注入 latest.yml
# （electron-builder 26 不支持 releaseNotesFile）。
publish:
  provider: generic
  url: https://oss.wapiagent.top/releases/
directories:
  output: release
files:
  - src/**
  - package.json
  - node_modules/**
extraResources:
  - from: resources/kernel
    to: kernel
    filter: ["**/*"]
  - from: resources/web
    to: web
    filter: ["**/*"]
  # 原生依赖（onnxruntime-node / sharp / @sqliteai/sqlite-vector + 各自平台分包）：
  #  ① 原生 .node/.dll 无法从 asar 内 dlopen → 必须落在 asar 之外（extraResources 天然如此）；
  #  ② bun 编译产物的运行时解析根是 cwd/node_modules，**不是可执行文件同目录**
  #     → 运行时由 main.cjs 的 linkNativeAssets 把 native/node_modules/* 链进
  #       WA_PI_DIR/runtime/node_modules（= kernel 的 cwd）。
  # 资产由 scripts/stage-native-assets.ts 按 --target 准备（交叉打包不会自动切换平台二进制）。
  # ⚠️ from 必须直接指向 node_modules 本体：electron-builder 的 filter 会无条件排掉
  #    「源目录根下名为 node_modules 的那一层」（fileMatcher 的 createFilter），
  #    写 from: resources/native + to: native 会让整个 native/node_modules 静默消失（实测踩过）。
  - from: resources/native/node_modules
    to: native/node_modules
    filter: ["**/*"]
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/assets/icon.ico
  signExecutable: false # 跳过签名但保留 resEdit 图标嵌入
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: src/assets/icon.ico
  uninstallerIcon: src/assets/icon.ico
linux:
  target: [AppImage]
  icon: src/assets/icon.png
  # scope 包名 @wa-pi/desktop 归一化后含 @/-，AppImage 可执行文件名不合法；显式指定合法名
  executableName: wa-pi-desktop
mac:
  target:
    - dmg
    - zip
  icon: src/assets/icon-mac.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  # 切断 Apple 时间戳服务（TSA）依赖：electron-builder 内部签名 pass（@electron/osx-sign）
  # 对每个文件无条件追加 `--timestamp`（不带 URL → Apple 默认 TSA），TSA 抖动/超时整包中止。
  # `timestamp: null` 无效——MacTargetHelper.buildSignOptions 里是
  # `timestamp: customSignOptions.timestamp || undefined`，null 被吞成 undefined 后
  # osx-sign 又落回默认 TSA 分支。codesign 同一选项「后者覆盖前者」，
  # additionalArguments 拼在 osx-sign 自带的 --timestamp 之后，故这里等价于显式关闭。
  # hardenedRuntime 保留（flags=runtime 不变）；自签名证书 + 未公证的包不需要时间戳，
  # OTA 更新验证用的是 identity 的 DR（certificate root），与时间戳无关。
  additionalArguments:
    - "--timestamp=none"
