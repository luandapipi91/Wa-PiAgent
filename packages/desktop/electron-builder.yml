appId: ai.wa-pi.desktop
productName: WA PI Agent
artifactName: "WaPi-Setup-${version}.${ext}"
npmRebuild: false
afterPack: scripts/after-pack.cjs
# 自动更新源：阿里云 OSS（公开读）。打包时据此生成 latest.yml（含 version/sha512/path）。
# releaseNotes 由 publish-oss.ts 上传前从 RELEASE_NOTES.md 读取注入 latest.yml（electron-builder 26 不支持 releaseNotesFile）。
publish:
  provider: generic
  url: https://coaicom.oss-cn-heyuan.aliyuncs.com/releases/
directories:
  output: release
files:
  - src/**
  - package.json
  - node_modules/**
extraResources:
  - from: resources/kernel
    to: kernel
    filter: ["**/*"]
  - from: resources/web
    to: web
    filter: ["**/*"]
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/assets/icon.ico
  signAndEditExecutable: false # Windows Defender 锁定 exe 导致 rcedit 竞态失败
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: src/assets/icon.ico
  uninstallerIcon: src/assets/icon.ico
linux:
  target: [AppImage]
  icon: src/assets/icon.png
mac:
  target:
    - dmg
    - zip
  icon: src/assets/icon-mac.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
