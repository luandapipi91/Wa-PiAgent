appId: ai.hiagent.desktop
productName: HiAgent
artifactName: "HiAgent.${ext}"   # 产物文件名不带版本号：HiAgent.dmg / HiAgent.zip / HiAgent.exe
directories:
  output: release
files:
  - src/**
  - package.json
  - node_modules/**      # electron-builder 自动只打包运行时依赖；electron 本体由它处理
extraResources:
  - from: resources/kernel
    to: kernel
    filter: ["**/*"]
  - from: resources/web
    to: web
    filter: ["**/*"]
asarUnpack:
  - resources/**          # sidecar 含原生二进制(hiagent-kernel/ast-grep)，需解包到磁盘才能 spawn
win:
  target: [portable]
  icon: src/assets/icon.ico
linux:
  target: [AppImage]
  icon: src/assets/icon.png
mac:
  target:
    - dmg
    - zip           # zip 便于后续做自动更新/手测；dmg 是给用户安装的主形态
  icon: src/assets/icon-mac.png
  category: public.app-category.productivity
  hardenedRuntime: true   # 公证前置要求；本地自签/未公证也能跑，但开启更接近正式分发
  gatekeeperAssess: false
  # 未配置 APPLE_ID/团队时 electron-builder 会跳过 notarize；目标仅本机可用时无需公证
  notarize: false
