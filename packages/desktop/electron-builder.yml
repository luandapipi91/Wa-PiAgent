appId: ai.hiagent.desktop
productName: HiAgent
artifactName: "HiAgent-Setup-${version}.${ext}"
npmRebuild: false
afterPack: scripts/after-pack.cjs
directories:
  output: release
files:
  - src/**
  - package.json
  - node_modules/**
extraResources:
  - from: resources/kernel
    to: kernel
    filter: ["**/*"]
  - from: resources/web
    to: web
    filter: ["**/*"]
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/assets/icon.ico
  signAndEditExecutable: false # Windows Defender 锁定 exe 导致 rcedit 竞态失败
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: src/assets/icon.ico
  uninstallerIcon: src/assets/icon.ico
linux:
  target: [AppImage]
  icon: src/assets/icon.png
mac:
  target:
    - dmg
    - zip
  icon: src/assets/icon-mac.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
