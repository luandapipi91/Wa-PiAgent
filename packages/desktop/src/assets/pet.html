<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>呱呱 · wa-pi 桌面宠物（HTML 版）</title>
<!--
  呱呱 · 桌面宠物小青蛙 v6 HTML/JS 版
  - 从 guagua.py (PySide6 v6) 1:1 移植：25 状态机 / 双轨自发调度 / 全部交互
  - 渲染：参数化 SVG，逻辑帧(40ms)与渲染帧分离，每帧全量重建场景字符串
  - 宿主：透明 BrowserWindow 直接 loadFile 本文件即可
      Electron main:
        new BrowserWindow({ transparent: true, frame: false, resizable: false,
          skipTaskbar: true, hasShadow: false, useContentSize: true,
          webPreferences: { preload } })   // 置顶（alwaysOnTop: true）=> 点击其它应用后不被遮挡
      preload 按文件底部注释挂 window.guaguaHost（全部接口可选，
      缺失时自动进入浏览器预览降级模式：页面即虚拟屏幕）
-->
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #dcefe0 0%, #cfe7d8 45%, #bfdcc8 100%);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  }
  /* Electron 透明窗口下页面背景必须透明：
     html 与 body 都声明了渐变，只清 body 会让 html 的渐变继续可见（窗口就不透明了） */
  html.transparent-host, body.transparent-host { background: transparent; }
  /* 嵌入模式：整窗就是宠物本体，#win 必须铺满窗口（预览模式的 left/top 偏移只用于模拟屏幕落点） */
  body.transparent-host #win { left: 0; top: 0; }

  /* ---- 宠物窗口容器（浏览器预览模式下可拖动） ---- */
  #win {
    position: absolute; left: 60px; top: 80px;
    width: 260px; height: 258px;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    cursor: default;
    /* 预览模式给一圈极淡的边界提示，嵌入模式(透明宿主)下不可见 */
    outline: 0px dashed rgba(74, 122, 58, 0);
  }
  body.preview #win { outline-width: 1px; outline-color: rgba(74, 122, 58, .18); }
  #scene { display: block; width: 100%; height: 100%; overflow: visible; }

  /* ---- 预览模式提示胶囊 ---- */
  #tip {
    position: fixed; left: 12px; bottom: 12px; z-index: 50;
    background: rgba(255,255,255,.92); border: 1px solid #4a7a3a;
    border-radius: 10px; padding: 8px 14px; font-size: 12px; color: #2f4a2a;
    box-shadow: 0 2px 10px rgba(47,74,42,.18);
    transition: opacity .6s; max-width: 46ch; line-height: 1.6;
  }
  #tip.gone { opacity: 0; pointer-events: none; }
  body.transparent-host #tip { display: none; }

  /* ---- 右键菜单（青蛙皮肤，照抄 MENU_QSS） ---- */
  .gmenu {
    position: fixed; z-index: 100; display: none;
    background: #ffffff; border: 2px solid #4a7a3a; border-radius: 10px;
    padding: 5px 4px; box-shadow: 0 6px 18px rgba(47,74,42,.25);
    min-width: 150px;
  }
  .gmenu .mi {
    padding: 6px 26px 6px 14px; margin: 2px 4px; border-radius: 6px;
    color: #2f4a2a; font-size: 12px; cursor: default; white-space: nowrap;
  }
  .gmenu .mi:hover, .gmenu .mi.open {
    background: #d8f3c1; color: #245c2a;
  }
  .gmenu .mi:active { background: #b9e39b; }
  .gmenu .sep { height: 1px; background: #dcead0; margin: 4px 10px; }
  .gmenu .sub {
    position: absolute; display: none;
    background: #ffffff; border: 2px solid #4a7a3a; border-radius: 10px;
    padding: 5px 4px; box-shadow: 0 6px 18px rgba(47,74,42,.25);
  }
  /* 大小滑条行 */
  .sizerow {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px 6px 8px; margin: 2px 4px;
  }
  .sizerow .lab { color: #4a7a3a; font-size: 11px; white-space: nowrap; }
  .sizerow .lab.big { font-size: 14px; }
  .sizerow input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 120px; height: 5px; border-radius: 2px;
    background: linear-gradient(to right, #a8d38b var(--fill,28%), #dcead0 var(--fill,28%));
    outline: none;
  }
  .sizerow input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 7px; background: #4a7a3a;
    cursor: pointer;
  }
  .sizerow .pct { color: #2f4a2a; font-weight: bold; font-size: 12px; min-width: 34px; text-align: right; }
</style>
</head>
<body>
<div id="win"><svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="tip"></div>

<!-- 主菜单 -->
<div class="gmenu" id="menuRoot">
  <div class="mi" id="miInter">互动 ▸</div>
  <div class="sep"></div>
  <div class="mi" id="miClose">关闭桌面宠物</div>
</div>
<!-- 互动二级菜单 -->
<div class="gmenu sub" id="menuInter">
  <div class="sizerow">
    <span class="lab">🐸</span>
    <input type="range" id="sizeRange" min="50" max="200" step="1" value="100">
    <span class="lab big">🐸🐸🐸</span>
    <span class="pct" id="sizePct">100%</span>
  </div>
  <div class="sep"></div>
  <div class="mi" data-act="hop">跳一下</div>
  <div class="mi" data-act="croak">呱一声！</div>
  <div class="mi" data-act="hunt">喂虫子</div>
  <div class="mi" data-act="sing">唱一首</div>
  <div class="mi" data-act="yawn">打哈欠</div>
  <div class="mi" data-act="look">左顾右盼</div>
  <div class="mi" data-act="puff">鼓腮啵~</div>
  <div class="mi" data-act="blep">吐舌头</div>
  <div class="mi" data-act="blow">吹泡泡</div>
  <div class="mi" data-act="sneeze">打喷嚏</div>
  <div class="mi" data-act="curious">好奇凑近你</div>
  <div class="mi" data-act="sleep">睡觉</div>
  <div class="sep"></div>
  <div class="mi" data-act="wander" id="miWander">溜达：开</div>
</div>

<script>
"use strict";
/* =====================================================================
 * 呱呱 HTML/JS 版 —— 从 guagua.py v6 (PySide6) 1:1 移植
 * 时间基准：TICK=40ms（25fps），所有时长以"帧"为单位，与 py 完全一致
 * 坐标约定：
 *   winX/winY   宿主窗口左上角（屏幕坐标）
 *   fx/fy       青蛙脚底锚点（屏幕坐标）= winX+AX / winY+AY
 *   场景 SVG    viewBox = 窗口尺寸(260k × 258k)，窗口内坐标 1:1 像素
 *   gp          全局光标（屏幕坐标）
 * ===================================================================== */

/* ---------------- 宿主接口（Electron preload 注入，全部可选） ---------------- */
const host = window.guaguaHost || null;
if (host) {
  document.body.classList.add("transparent-host");
  // html 也加：否则 html 上的渐变会当不透明底画出来，窗口就不透明了
  document.documentElement.classList.add("transparent-host");
} else document.body.classList.add("preview");

/* ---------------- 常量（与 guagua.py v6 对齐） ---------------- */
const TICK = 40;
const BASE_W = 260, BASE_H = 258, BASE_AX = 130, BASE_S = 0.9;
const SING_COOLDOWN = 1500, HUNT_COOLDOWN = 1250;
const CURIOUS_COOLDOWN = 2250, YAWN_COOLDOWN = 4500;
const GAZE_IDLE_TICKS = 100;
const SLEEP_AFTER = [1750, 2750], SLEEP_DUR = [375, 750];
const HUNT_MISS_RATE = 0.3;
const HOP_EVERY = [300, 1000], SPECIAL_EVERY = [1000, 2250];
const SPECIALS = [["croak",12],["yawn",5],["look",10],["puff",8],["blep",8],
                  ["blow",6],["sneeze",5],["sing",6],["hunt",8],["curious",6]];

/* ---------------- 小工具 ---------------- */
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));   // py: random.randint 含端点
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
const f1 = v => (Math.round(v * 10) / 10).toString();
const f2 = v => (Math.round(v * 100) / 100).toString();

/* ---------------- 几何（随缩放系数变化） ---------------- */
let K = 1.0, WIN_W = BASE_W, WIN_H = BASE_H, AX = BASE_AX, AY = 246, S = BASE_S;
// 窗口尺寸是固定的（见 WIN_MAX_W/H）：#win 在窗口内居中，缩放时中心点不动
let WIN_OFF_X = 0, WIN_OFF_Y = 0;
// 菜单展开期间窗口会被临时放大（见后文菜单段）：此期间缩放逻辑不得覆盖窗口尺寸
let menuWinOpen = false;
const winEl = document.getElementById("win");
const sceneEl = document.getElementById("scene");

function applyGeometry(skipWindow) {
  WIN_W = Math.round(BASE_W * K);
  WIN_H = Math.round(BASE_H * K);
  AX = Math.round(WIN_W / 2);
  // 青蛙视觉中心落在 #win 的垂直中心（#win 又居中于窗口）→ 缩放时中心点不动
  AY = Math.round(WIN_H / 2 + FROG_CENTER_DY * K);
  S = BASE_S * K;
  winEl.style.width = WIN_W + "px";
  winEl.style.height = WIN_H + "px";
  // #win 在固定尺寸的窗口里居中：缩放时宠物中心留在窗口中心（窗口位置恒定 → 屏幕上也不动）
  WIN_OFF_X = Math.round((WIN_MAX_W - WIN_W) / 2);
  WIN_OFF_Y = Math.round((WIN_MAX_H - WIN_H) / 2);
  winEl.style.left = WIN_OFF_X + "px";
  winEl.style.top = WIN_OFF_Y + "px";
  sceneEl.setAttribute("viewBox", `0 0 ${WIN_W} ${WIN_H}`);
  sceneEl.setAttribute("width", WIN_W);
  sceneEl.setAttribute("height", WIN_H);
  // 窗口尺寸恒定（方案：固定尺寸 + 窗口内部缩放），这里不再下发任何窗口尺寸
}

/* ---------------- 配置持久化（scale / wander / pos） ---------------- */
let cfgSaveTimer = null;
let lastSavedPos = null;
function saveConfig() {
  lastSavedPos = { x: Math.round(st.fx), y: Math.round(st.fy) };
  const cfg = {
    scale: Math.round(K * 1000) / 1000,
    wander: st.wander,
    // 位置记忆：存脚底锚点（屏幕坐标），缩放后宠物仍停在同一点
    pos: { x: Math.round(st.fx), y: Math.round(st.fy) },
  };
  if (host && host.saveConfig) { host.saveConfig(cfg); return; }
  clearTimeout(cfgSaveTimer);
  cfgSaveTimer = setTimeout(() => {
    try { localStorage.setItem("guagua_cfg", JSON.stringify(cfg)); } catch (e) {}
  }, 400);
}
function loadConfig() {
  let cfg = {};
  if (host && host.loadConfig) { try { cfg = host.loadConfig() || {}; } catch (e) {} }
  else { try { cfg = JSON.parse(localStorage.getItem("guagua_cfg") || "{}"); } catch (e) {} }
  K = clamp(parseFloat(cfg.scale) || 1.0, 0.5, 2.0);
  applyGeometry();
  return cfg;
}
/* 溜达/缩放后位置变了就记一次（1s 比对一次、位移超 4px 才算；宿主侧还会再节流写盘） */
let posCheckTick = 0;
function savePosIfMoved() {
  if (++posCheckTick < 25) return;
  posCheckTick = 0;
  const x = Math.round(st.fx), y = Math.round(st.fy);
  if (lastSavedPos && Math.abs(lastSavedPos.x - x) < 4 && Math.abs(lastSavedPos.y - y) < 4) return;
  saveConfig();
}

/* ---------------- 屏幕信息（虚拟桌面） ----------------
 * 浏览器模式：视口即虚拟屏；Electron 模式：宿主提供，周期刷新 */
let virt = { l: 0, t: 0, r: 1920, b: 1040 };
let screens = [virt];
function refreshScreens() {
  if (host && host.getScreenInfo) {
    try {
      const si = host.getScreenInfo();
      if (si && si.virt) {
        virt = si.virt; screens = si.screens && si.screens.length ? si.screens : [virt];
        return;
      }
    } catch (e) {}
  }
  virt = { l: 0, t: 0, r: window.innerWidth, b: window.innerHeight };
  screens = [virt];
}
function screenAt(x) {
  for (const g of screens) if (x >= g.l && x <= g.r) return g;
  let best = screens[0], bd = 1e9;
  for (const g of screens) {
    const d = Math.min(Math.abs(x - g.l), Math.abs(x - g.r));
    if (d < bd) { bd = d; best = g; }
  }
  return best;
}

/* ---------------- 窗口位置（唯一真源，拖拽/蹦跶共用） ---------------- */
let winX = 60, winY = 80;
/* 位置 + 尺寸一次下发：拆成 moveWindow + setWindowSize 两次 IPC 时，中间态会让
 * 宠物在屏幕上跳（DOM 已按新锚点绘制、窗口还没挪到位）。 */
function setWinBounds(x, y, w, h) {
  winX = Math.round(x); winY = Math.round(y);
  if (host && host.setWindowBounds) { host.setWindowBounds(winX, winY, Math.round(w), Math.round(h)); return; }
  // 降级（缺少该接口的宿主）：退回先移动位置
  if (host && host.moveWindow) host.moveWindow(winX, winY);
  else { winEl.style.left = winX + "px"; winEl.style.top = winY + "px"; }
}
function setWinPos(x, y) {
  winX = x; winY = y;
  if (host && host.moveWindow) host.moveWindow(Math.round(x), Math.round(y));
  else { winEl.style.left = Math.round(x) + "px"; winEl.style.top = Math.round(y) + "px"; }
}

/* 青蛙中心相对脚底的纵向偏移系数：窗口内脚底锚点在 AY、身体视觉中心在 AY - 54K。
 * st.fy 的语义是「青蛙中心的屏幕 y」（不再是从前的脚底），
 * 这样缩放时中心点在屏幕上保持不动（脚底对齐会让中心随体型上下漂）。 */
const FROG_CENTER_DY = 54;
/** 由锚点（fx = 水平中心、fy = 青蛙中心）反推窗口左上角：
 *  窗口中心与青蛙中心重合，故偏移是常量（与缩放无关）——这也是缩放不碰窗口几何的根源。 */
function winPosFor(fx, fy) {
  return { x: Math.round(fx - WIN_MAX_W / 2), y: Math.round(fy - WIN_MAX_H / 2) };
}
/** 青蛙中心在屏幕上的纵向可取范围（宠物本体不出屏） */
function frogFyRange() {
  // 按「头顶不出屏上边、脚底不出屏下边」算：头顶约在中心上方 80K、脚底在下方 54K
  return {
    min: virt.t + Math.round(80 * K),
    max: virt.b - Math.round(54 * K),
  };
}

/* ---------------- 光标（屏幕坐标） ----------------
 * 浏览器：mousemove 维护；Electron：宿主 getCursorPos 轮询 + mousemove 兜底。
 * hostGp 额外保留一份「宿主轮询值」：页面自身的 mousemove 给的是局部坐标，
 * 且穿透状态下收不到 mousemove，穿透判定必须用宿主坐标（屏幕坐标）。 */
let gp = { x: -9999, y: -9999 };
let hostGp = null;
// 宿主回报的「实际」窗口位置：只给穿透判定用。不能覆盖 winX/winY——
// 那两个是页面自己的定位基准（拖动、applyPos 都依赖），每 40ms 覆盖会干扰定位。
let realWinX = null, realWinY = null;
// 光标坐标只允许一个来源。Electron 下由宿主轮询给屏幕坐标（拖动、眼神跟随、凑脸判定的
// 唯一依据）；页面自身的 mousemove 给的是窗口局部坐标——两者混写会让 pointerdown 记下的
// 坐标与 pointermove 读到的坐标不同源，dx 变成数千像素，一点就把窗口 clamp 到虚拟桌面
// 边缘（多屏下表现为「宠物跑到另一块屏、原地不见了」）。
if (host && host.getCursorPos) {
  setInterval(() => {
    Promise.resolve(host.getCursorPos()).then(p => {
      if (p && isFinite(p.x)) {
        gp = { x: p.x, y: p.y }; hostGp = { x: p.x, y: p.y };
        // 只记到 realWinX/realWinY（供穿透判定）：不能覆盖 winX/winY，
        // 否则会干扰页面自身的定位与拖动基准。
        if (isFinite(p.winX) && isFinite(p.winY)) {
          realWinX = Math.round(p.winX); realWinY = Math.round(p.winY);
        }
      }
    }).catch(() => {});
  }, 40);
} else {
  // 浏览器预览模式：窗口即虚拟屏，局部坐标就是屏幕坐标
  window.addEventListener("mousemove", e => { gp = { x: e.pageX, y: e.pageY }; }, { passive: true });
}

/* ---------------- 点击穿透（宿主透明窗口） ----------------
 * 整窗是矩形，只有青蛙本体、气泡、右键菜单需要收鼠标：
 * 命中 SVG 图形元素 = 收鼠标；命中 <svg> 根 / body = 透明区 = 穿透（点到下方桌面）。
 * 判定用宿主光标（穿透态下页面收不到 mousemove），局部坐标 = 宿主光标 - 窗口左上角。
 * 每帧 render() 全量重建 SVG，拿不到稳定的元素引用 → 用当帧 elementFromPoint。 */
let clickThrough = false;
function hitTest(mx, my) {
  const el = document.elementFromPoint(mx, my);
  if (!el) return false;                                        // 窗口外 → 透明
  const inMenu = menuRoot.contains(el) || menuInter.contains(el);
  // 菜单展开期间：只有菜单矩形本身算「可点」，其余（含为放菜单临时放大出来的透明区）
  // 一律穿透——这样「点菜单外」的那一下会直接落到桌面/其它应用，不用点两次。
  if (menuWinOpen) return inMenu;
  if (inMenu) return true;
  // SVG 图形元素（ellipse/circle/path/text）= 青蛙本体或气泡；<svg> 根不算
  return el.namespaceURI === "http://www.w3.org/2000/svg" && el.tagName.toLowerCase() !== "svg";
}
function checkClickThrough() {
  if (!host || !host.setClickThrough || !hostGp) return;
  // 抓取期间绝不切穿透：快拖时窗口 setBounds 异步有延迟，光标会瞬间冲出窗口/
  // 落到透明区，此时若开启穿透，Windows 会解除指针捕获并停发 pointermove/
  // pointerup——抟脱离鼠标、体积松散也收不到（st.grab 残留，光标移回蛙体
  // 又「吸」着走）。pointerdown 只可能发生在非穿透态，故 grab 存续期间保持
  // 非穿透即可保证事件不断流；松手后下一帧恢复正常判定。
  if (st.grab) return;
  // 用宿主回报的「实际」窗口位置做判定：窗口移动是异步的（setBounds 生效有延迟），
  // 页面自算的 winX/winY 会短暂落后于实际，用它换算会把「光标明明在青蛙上」判成不在
  // → 开穿透 → 点不到（刚打开那几秒尤其明显）。拿不到实际值时才退回本地值。
  const bx = realWinX === null ? winX : realWinX;
  const by = realWinY === null ? winY : realWinY;
  const inside = hitTest(hostGp.x - bx, hostGp.y - by);
  const next = !inside;
  if (next === clickThrough) return;   // 只在状态变化时发 IPC
  clickThrough = next;
  host.setClickThrough(next);
}

/* ---------------- 状态（1:1 对应 py 的 st 字典） ---------------- */
const st = {
  state: "idle", ticks: 0, dur: 60,
  fx: 0, fy: 0,                 // 启动时初始化
  x0: 0, y0: 0, x1: 0, y1: 0, jh: 70,
  hop_intent: null,
  facing: 1, sw: 1, sh: 1, bob: 0, jx: 0, ck: 1,
  eyes: "open", mouth: "smile",
  blink_in: 60, blink_left: 0,
  bubble_text: null, bubble_left: 0,
  hearts: [], notes: [], drops: [],
  bub: null,
  wander: true,
  grab: null, moved: false,
  pogx: 2, pogy: 2, startle_cd: 0,
  mouse_idle_t: 0, last_gp: null,
  dgx: 0, dgy: 0,
  total: 0, last_sing: -99999, last_hunt: -99999,
  last_curious: -99999, last_yawn: -99999,
  last_events: [], hunt_miss: false,
  awake_t: 0, sleep_after: 0, sleep_t: 0, sleep_dur: 0,
  fly: null, tongue: null,
  swing: 0, last_wx: null, shake: 0, will_dizzy: false,
  tickle_e: 0, prev_cx: null, prev_dir: 0, tickle_cd: 0,
  next_hop_t: 350, next_special_t: 1250, air: 13,
};

function say(text, left) { st.bubble_text = text; st.bubble_left = left; }

function markAwake() {
  st.awake_t = 0;
  st.sleep_after = randi(SLEEP_AFTER[0], SLEEP_AFTER[1]);
  st.next_hop_t = Math.max(st.next_hop_t, st.total + 200);
  st.next_special_t = Math.max(st.next_special_t, st.total + 600);
}
function ensureAwake() {
  if (["sleepy", "sleep", "wake"].includes(st.state)) toIdle();
  markAwake();
}
function toIdle() {
  Object.assign(st, { state: "idle", ticks: 0, dur: randi(60, 170),
                      dgx: 0, dgy: 0, jx: 0, ck: 1, bub: null });
}

/* ---------------- 行为触发（公式照抄 py） ---------------- */
function startHop(tx = null, intent = null) {
  refreshScreens();
  // 归属屏 = 宠物当前所在的屏幕（用户拖到哪块屏就归哪块）。
  // 自发动作（溜达/蹦跃）只能在归属屏内活动——只有用户拖动才允许换屏。
  const home = screenAt(st.fx);
  if (tx === null) {
    const dist = randi(180, 460) * (Math.random() < 0.5 ? -1 : 1);
    tx = st.fx + dist;
  }
  const x1 = clamp(tx, home.l + PET_EDGE_MARGIN, home.r - PET_EDGE_MARGIN);
  // 落点纵向也要能到上下边：按「头顶不出屏顶、脚底不出屏底」算（原先上留 100 / 下留 40）
  const yLo = Math.round(home.t + 80 * K);
  const yHi = Math.round(home.b - 54 * K);
  const y1 = randi(Math.max(yLo, Math.min(yLo, yHi)), Math.max(yLo, yHi));
  const dist = Math.hypot(x1 - st.fx, y1 - st.fy);
  const air = Math.round(clamp(dist / 28, 13, 60));
  Object.assign(st, { x0: st.fx, y0: st.fy, x1, y1, air,
    jh: randi(55, 90) * (1 + Math.min(dist / 2000, 0.8)),
    facing: x1 >= st.fx ? 1 : -1,
    state: "hop", ticks: 0, hop_intent: intent });
}
function startCroak() {
  Object.assign(st, { state: "croak", ticks: 0, dur: 34,
    bubble_text: pick(["呱呱！", "呱~呱~", "呱呱呱!!"]), bubble_left: 32 });
}
function startHappy() {
  Object.assign(st, { state: "happy", ticks: 0, dur: 18,
    facing: Math.random() < 0.5 ? -1 : 1 });
}
function startSing() {
  Object.assign(st, { state: "sing", ticks: 0, dur: 60, last_sing: st.total,
    bubble_text: "呱呱~♪ 呱呱~♫", bubble_left: 50 });
}
function startHunt() {
  if (st.fly !== null) return;
  st.fly = { x: rand(30, WIN_W - 30), y: rand(24, AY - 30),
             tx: rand(30, WIN_W - 30), ty: rand(24, AY - 30), wt: 0, flee: false };
  st.hunt_miss = Math.random() < HUNT_MISS_RATE;
  Object.assign(st, { state: "hunt_watch", ticks: 0, dur: randi(50, 90), last_hunt: st.total });
}
function startYawn() {
  Object.assign(st, { state: "yawn", ticks: 0, dur: 42, last_yawn: st.total });
  say("哈~呜——", 40);
}
function startLook() {
  Object.assign(st, { state: "look", ticks: 0, dur: 55 });
  if (Math.random() < 0.4) say("嗯？", 25);
}
function startPuff() { Object.assign(st, { state: "puff", ticks: 0, dur: 46 }); }
function startBlep() { Object.assign(st, { state: "blep", ticks: 0, dur: 50 }); }
function startBlow() {
  Object.assign(st, { state: "blow", ticks: 0, dur: 56 });
  st.bub = { t: 0, x: AX + 1.0 * K, y: AY - 60.0 * K };
}
function startSneeze() { Object.assign(st, { state: "sneeze", ticks: 0, dur: 35 }); }
function startCurious() {
  st.last_curious = st.total;
  startHop(gp.x, "curious");
}
function startSleep() {
  if (st.state === "hop" || st.state === "drag") return;
  Object.assign(st, { state: "sleep", ticks: 0, sleep_t: 0,
    sleep_dur: randi(SLEEP_DUR[0], SLEEP_DUR[1]) });
  say("Z z z", 80);
}
function startCelebrate() {
  Object.assign(st, { state: "celebrate", ticks: 0, dur: 72 });
  say("呱呱呱 任务完成！", 70);
}
/* 动作表：互动动作与「对话完成」的随机动作不区分了——
 * 池子直接由二级菜单的动作项派生，执行也走菜单点击那条路径，
 * 菜单里增删动作时两边自动保持一致（wander 是开关，不算动作）。 */
function actionPool() {
  return [...document.querySelectorAll("#menuInter .mi[data-act]")]
    .map(el => el.dataset.act)
    .filter(a => a !== "wander");
}
/** 动作执行入口：菜单点击与「对话完成」的随机动作共用同一条路径 */
function runAction(a) {
  if (a === "hop") hopNow();
  else if (a === "sleep") startSleep();
  else dispatch(a);
}
/** 该动作此刻能否真的执行：
 *  「喂虫子」已有虫在飞、与「睡觉」在跳/拖动时都是空操作，不滤掉的话
 *  抽到它就等于「任务完成」毫无反应。 */
function canRunAction(a) {
  if (a === "hunt") return st.fly === null;
  if (a === "hop") return st.state !== "drag";
  if (a === "sleep") return st.state !== "hop" && st.state !== "drag";
  return true;
}
function startRandomCelebrate() {
  const pool = actionPool().filter(canRunAction);
  if (!pool.length) return;
  runAction(pick(pool));
}
function hopNow() { if (st.state !== "drag") startHop(); }
function toggleWander() {
  st.wander = !st.wander;
  document.getElementById("miWander").textContent = "溜达：" + (st.wander ? "开" : "关");
  saveConfig();
}
function spawnHeart() {
  st.hearts.push({
    x: AX + rand(-45, 45) * K,
    y: AY - 120 * K + rand(-10, 10) * K,
    vy: -1.4 - Math.random() * 0.8,
    life: 24, size: pick([13, 16, 19]), ch: "♥", col: "#ff5f7a",
  });
}
function dispatch(a) {
  const m = { croak: startCroak, sing: startSing, hunt: startHunt,
              yawn: startYawn, look: startLook, puff: startPuff,
              blep: startBlep, blow: startBlow, celebrate: startCelebrate,
              sneeze: startSneeze, curious: startCurious };
  (m[a] || (() => {}))();
}

/* ---------------- 特殊动作抽取（防重复 + 独立冷却） ---------------- */
function pickSpecial() {
  const recent = new Set(st.last_events);
  const cands = [];
  for (const [a, w] of SPECIALS) {
    if (recent.has(a)) continue;
    if (a === "sing" && st.total - st.last_sing < SING_COOLDOWN) continue;
    if (a === "hunt" && (st.total - st.last_hunt < HUNT_COOLDOWN || st.fly !== null)) continue;
    if (a === "curious" && (st.total - st.last_curious < CURIOUS_COOLDOWN || !st.wander)) continue;
    if (a === "yawn" && st.total - st.last_yawn < YAWN_COOLDOWN) continue;
    cands.push([a, w]);
  }
  if (!cands.length) return null;
  let r = Math.random() * cands.reduce((s, c) => s + c[1], 0);
  for (const [a, w] of cands) { r -= w; if (r <= 0) return a; }
  return cands[cands.length - 1][0];
}

/* ---------------- 睡眠 ---------------- */
function wakeUp(startled) {
  if (["sleepy", "sleep"].includes(st.state)) {
    const nx = AX + st.dgx + st.jx + 6 * K;
    const ny = AY + st.bob + st.dgy - 73 * K;
    for (let i = 0; i < 5; i++) {
      const a = rand(0, 6.283), sp = rand(1.2, 2.6) * K;
      st.drops.push({ x: nx, y: ny, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 16 });
    }
  }
  markAwake();
  st.sleep_t = 0;
  if (startled) {
    Object.assign(st, { state: "startle", ticks: 0, dur: 18,
      dgx: gp.x <= st.fx ? 10 * K : -10 * K, dgy: 4 * K,
      bubble_text: "吓醒啦！！", bubble_left: 30 });
  } else {
    Object.assign(st, { state: "wake", ticks: 0, dur: 40,
      bubble_text: "哈~睡饱啦", bubble_left: 35 });
  }
}

/* ---------------- 猎物 ---------------- */
function updateFly() {
  const f = st.fly;
  if (f === null || f.flee) return;
  f.wt -= 1;
  const dx = f.tx - f.x, dy = f.ty - f.y;
  const d = Math.hypot(dx, dy);
  if (d < 8 || f.wt <= 0) {
    f.tx = rand(30, WIN_W - 30); f.ty = rand(24, AY - 30);
    f.wt = randi(12, 28);
  } else {
    f.x += dx / d * 2.2 + rand(-0.8, 0.8);
    f.y += dy / d * 2.2 + rand(-0.8, 0.8);
  }
}

/* ---------------- 目光跟随 ---------------- */
function updateGaze(eyes) {
  if (eyes !== "open" && eyes !== "wide") return;
  const ox = st.fx, oy = st.fy - 113 * K;
  let tgx = null, tgy = null;
  if (st.fly !== null && (st.state === "hunt_watch" || st.state === "tongue")) {
    const sxp = st.fx - AX + st.fly.x;
    const syp = st.fy - AY + st.fly.y;
    const dxm = sxp - ox, dym = syp - oy, d = Math.hypot(dxm, dym);
    if (d > 0.001) {
      const m = Math.min(10, d * 0.35 / Math.max(K, 0.5));
      tgx = dxm / d * m; tgy = dym / d * m;
    }
  } else if (st.state === "watchyou") {
    const dxm = gp.x - ox, dym = gp.y - oy, d = Math.hypot(dxm, dym);
    if (d > 0.001) { tgx = dxm / d * 10; tgy = dym / d * 10; }
  } else if (st.state === "look") {
    tgx = 9 * Math.sin(st.ticks * 0.22);
    tgy = 2 + 1.5 * Math.sin(st.ticks * 0.13);
  } else if (st.state === "blep") {
    tgx = st.facing; tgy = 6;
  }
  if (tgx === null) {
    if (st.mouse_idle_t >= GAZE_IDLE_TICKS) { tgx = 0; tgy = 2; }
    else {
      const dxm = gp.x - ox, dym = gp.y - oy, d = Math.hypot(dxm, dym);
      const kk = clamp((d - 140 * K) / (260 * K), 0, 1);
      const ux = d > 0.001 ? dxm / d : 0, uy = d > 0.001 ? dym / d : 0;
      tgx = ux * 10 * kk;
      tgy = 2 * (1 - kk) + uy * 10 * kk;
    }
  }
  st.pogx += (tgx - st.pogx) * 0.35;
  st.pogy += (tgy - st.pogy) * 0.35;
}

/* =====================================================================
 * 状态机 _tick —— 25 个状态分支，公式与 py 逐行对齐
 * ===================================================================== */
function tick() {
  try { tickCore(); } catch (e) { console.error("[guagua]", e); }
}

function tickCore() {
  st.total += 1;
  st.ticks += 1;
  if (st.bubble_left > 0) st.bubble_left -= 1;

  // 粒子步进
  for (const h of st.hearts) { h.y += h.vy; h.life -= 1; }
  st.hearts = st.hearts.filter(h => h.life > 0);
  for (const n of st.notes) { n.x += n.vx; n.y += n.vy; n.life -= 1; }
  st.notes = st.notes.filter(n => n.life > 0);
  for (const d of st.drops) { d.x += d.vx; d.y += d.vy; d.vy += 0.12; d.life -= 1; }
  st.drops = st.drops.filter(d => d.life > 0);

  // 鼠标静止检测
  if (st.last_gp === null || Math.hypot(gp.x - st.last_gp[0], gp.y - st.last_gp[1]) > 2) st.mouse_idle_t = 0;
  else st.mouse_idle_t += 1;
  st.last_gp = [gp.x, gp.y];

  let eyes = "open", mouth = "smile";
  let sw = 1, sh = 1, bob = 0, jx = 0, ck = 1;

  // 拎起摆动 / 甩晕能量（vx=窗口水平速度）
  const vx = st.last_wx === null ? 0 : winX - st.last_wx;
  st.last_wx = winX;
  if (st.state === "drag") {
    const tgt = clamp(-vx * 1.4, -38, 38);
    st.swing += (tgt - st.swing) * 0.25;
    if (Math.abs(vx) > 22) st.shake += 1;
    else st.shake = Math.max(0, st.shake - 1);
    if (st.shake > 10) st.will_dizzy = true;
  } else {
    st.swing += (0 - st.swing) * 0.2;
  }
  const swing = st.swing;

  switch (st.state) {

    case "idle": {
      st.awake_t += 1;
      bob = Math.sin(st.ticks * 0.22) * 2 * K;
      if (st.blink_left > 0) { st.blink_left -= 1; eyes = "closed"; }
      else {
        st.blink_in -= 1;
        if (st.blink_in <= 0) { st.blink_left = 4; st.blink_in = randi(50, 130); }
      }
      // 凑脸 → 吓一跳
      if (st.startle_cd > 0) st.startle_cd -= 1;
      else {
        const ddx = st.fx - gp.x, ddy = (st.fy - 95 * K) - gp.y;
        const d = Math.hypot(ddx, ddy);
        if (d < 55 * K) {
          const dd = d > 0.5 ? d : 1;
          markAwake();
          Object.assign(st, { state: "startle", ticks: 0, dur: 18,
            dgx: ddx / dd * 10 * K, dgy: ddy / dd * 5 * K,
            bubble_text: "！？", bubble_left: 16, startle_cd: 220 });
        }
      }
      // 挠痒痒
      if (st.tickle_cd > 0) st.tickle_cd -= 1;
      if (st.tickle_cd === 0) {
        const cx_ = gp.x - winX - WIN_OFF_X, cy_ = gp.y - winY - WIN_OFF_Y;
        if (Math.abs(cx_ - AX) < 58 * K && (AY - 80 * K) < cy_ && cy_ < (AY - 8 * K)) {
          let dir_ = 0;
          const pc = st.prev_cx === null ? cx_ : st.prev_cx;
          if (cx_ - pc > 2) dir_ = 1;
          else if (pc - cx_ > 2) dir_ = -1;
          if (dir_ !== 0 && st.prev_dir !== 0 && dir_ !== st.prev_dir) st.tickle_e += 2;
          else st.tickle_e = Math.max(0, st.tickle_e - 0.4);
          st.prev_dir = dir_;
          if (st.tickle_e >= 6) {
            st.tickle_e = 0; st.tickle_cd = 150;
            markAwake();
            Object.assign(st, { state: "laugh", ticks: 0, dur: 30 });
            say("哈哈哈哈~", 26);
          }
        } else {
          st.tickle_e = Math.max(0, st.tickle_e - 0.4);
        }
        st.prev_cx = cx_;
      }
      // 菜单展开期间不做任何自发动作（含溜达与打盹）：用户正在调整大小/选项，
      // 宠物乱动会干扰操作。菜单收起后调度自然恢复（计时器仍在走）。
      if (!menuWinOpen) {
      // 困了
      if (st.awake_t > st.sleep_after) {
        Object.assign(st, { state: "sleepy", ticks: 0, dur: 45 });
        say("呼...困了...", 45);
      }
      // 双轨自发调度
      else if (st.total >= st.next_hop_t) {
        if (st.wander) { startHop(); st.next_hop_t = st.total + randi(HOP_EVERY[0], HOP_EVERY[1]); }
        else st.next_hop_t = st.total + 250;
      }
      else if (st.total >= st.next_special_t) {
        const a = pickSpecial();
        if (a === null) st.next_special_t = st.total + 300;
        else {
          st.last_events = [a, ...st.last_events].slice(0, 3);
          st.next_special_t = st.total + randi(SPECIAL_EVERY[0], SPECIAL_EVERY[1]);
          dispatch(a);
        }
      }
      }
      break;
    }

    case "hop": {
      const t_ = st.ticks, air = Math.max(st.air, 1);
      if (t_ <= 5) { sw = 1.12; sh = 0.84; st.fx = st.x0; st.fy = st.y0; }
      else if (t_ <= 5 + air) {
        const tt = (t_ - 5) / air;
        st.fx = st.x0 + (st.x1 - st.x0) * tt;
        st.fy = st.y0 + (st.y1 - st.y0) * tt - st.jh * Math.sin(Math.PI * tt);
        sw = 0.94; sh = 1.08;
      }
      else if (t_ <= 5 + air + 5) { sw = 1.10; sh = 0.87; st.fx = st.x1; st.fy = st.y1; }
      else {
        st.fx = st.x1; st.fy = st.y1;
        const intent = st.hop_intent;
        st.hop_intent = null;
        if (intent === "curious") {
          Object.assign(st, { state: "watchyou", ticks: 0, dur: 100 });
          say(pick(["你在干嘛呀~", "给我看看！", "盯——"]), 60);
        } else toIdle();
      }
      break;
    }

    case "happy": {
      const t_ = st.ticks;
      if (t_ <= 12) {
        const tt = t_ / 12;
        bob = -48 * K * Math.sin(Math.PI * tt);
        if (t_ === 2 || t_ === 5 || t_ === 8) spawnHeart();
        eyes = "happy"; mouth = "big"; sw = 0.98; sh = 1.02;
      } else if (t_ <= 17) { sw = 1.08; sh = 0.90; }
      else toIdle();
      break;
    }

    case "croak": {
      const k_ = Math.min(st.ticks / st.dur, 1);
      sw = 1 + 0.07 * Math.sin(Math.PI * k_);
      sh = 1 + 0.03 * Math.sin(Math.PI * k_);
      mouth = "o";
      if (st.ticks >= st.dur) toIdle();
      break;
    }

    case "drag": eyes = "wide"; mouth = "o"; sw = 0.97; sh = 1.05; break;

    case "land": sw = 1.10; sh = 0.86; if (st.ticks >= st.dur) toIdle(); break;

    case "startle": {
      eyes = "wide"; mouth = "o"; sw = 1.06; sh = 0.93;
      st.dgx *= 0.82; st.dgy *= 0.82;
      if (st.ticks >= st.dur) { st.dgx = 0; st.dgy = 0; toIdle(); }
      break;
    }

    case "dizzy": {
      const t_ = st.ticks;
      eyes = "dizzy"; mouth = "wavy";
      jx = 3.5 * K * Math.sin(t_ * 0.5) * (1 - t_ / st.dur);
      if (t_ >= st.dur) toIdle();
      break;
    }

    case "laugh": {
      eyes = "happy"; mouth = "big";
      jx = rand(-2.5, 2.5) * K;
      if (st.ticks === 8 || st.ticks === 16) spawnHeart();
      if (st.ticks >= st.dur) toIdle();
      break;
    }

    case "sing": {
      const t_ = st.ticks;
      mouth = Math.floor(t_ / 6) % 2 === 0 ? "o" : "smile";
      jx = 4 * K * Math.sin(t_ * 0.35);
      if (t_ % 8 === 0 && t_ > 2) {
        st.notes.push({ x: AX + rand(-20, 20) * K, y: AY - 148 * K,
          vx: rand(-0.5, 0.5), vy: -1.1, life: 34, size: pick([13, 16, 19]),
          ch: pick(["♪", "♫", "♩"]),
          col: pick(["#ffb340", "#ff8a5c", "#7ccb5e"]) });
      }
      if (t_ >= st.dur) toIdle();
      break;
    }

    case "hunt_watch": {
      sw = 1.02;
      updateFly();
      if (st.ticks >= st.dur && st.fly !== null) {
        const f = st.fly;
        const ty = f.y - (st.hunt_miss ? 45 * K : 0);
        st.tongue = { phase: "out", t: 0, tx: f.x, ty };
        Object.assign(st, { state: "tongue", ticks: 0 });
      } else if (st.fly === null) toIdle();
      break;
    }

    case "tongue": {
      eyes = "wide"; mouth = "o";
      const t = st.tongue;
      if (t === null) toIdle();
      else {
        t.t += 1 / 6;
        if (t.phase === "out" && t.t >= 1) {
          t.phase = "back"; t.t = 0;
          if (st.hunt_miss && st.fly !== null) st.fly.flee = true;
        } else if (t.phase === "back" && t.t >= 1) {
          st.fly = null; st.tongue = null;
          if (st.hunt_miss) {
            st.hunt_miss = false;
            Object.assign(st, { state: "puzzled", ticks: 0, dur: 25 });
            say("呱？", 22);
          } else {
            Object.assign(st, { state: "gulp", ticks: 0, dur: 12 });
            say("呱好吃~", 55);
          }
        }
      }
      break;
    }

    case "puzzled": mouth = "wavy"; if (st.ticks >= st.dur) toIdle(); break;

    case "gulp":
      mouth = "big";
      sh = 1 + 0.05 * Math.sin(Math.PI * Math.min(st.ticks / 12, 1));
      if (st.ticks >= st.dur) toIdle();
      break;

    case "yawn": {
      const t_ = st.ticks;
      mouth = "yawn"; eyes = "closed";
      const k_ = Math.min(t_ / st.dur, 1);
      sw = 1 + 0.05 * Math.sin(Math.PI * k_);
      sh = 1 + 0.03 * Math.sin(Math.PI * k_);
      if (t_ >= st.dur) toIdle();
      break;
    }

    case "look":
      eyes = "open";
      if (st.ticks === 27) st.facing *= -1;
      if (st.ticks >= st.dur) toIdle();
      break;

    case "puff": {
      const t_ = st.ticks;
      mouth = "o";
      if (t_ <= 32) ck = 1 + 1.3 * (t_ / 32);
      else {
        if (t_ === 33) say("啵！", 14);
        ck = Math.max(0.95, 2.3 - (t_ - 32) * 0.45);
        bob = -6 * K * Math.sin((t_ - 32) / 14 * Math.PI);
      }
      if (t_ >= st.dur) toIdle();
      break;
    }

    case "blep": eyes = "open"; if (st.ticks >= st.dur) toIdle(); break;

    case "blow": {
      mouth = "o"; ck = 1.12;
      const b = st.bub;
      if (b !== null) {
        b.t += 1;
        b.y -= 0.25 * K;
        if (b.t >= 40) {
          for (let i = 0; i < 6; i++) {
            const a2 = rand(0, 6.283), sp = rand(1.5, 3) * K;
            st.drops.push({ x: b.x, y: b.y, vx: Math.cos(a2) * sp, vy: Math.sin(a2) * sp, life: 18 });
          }
          say("啪！", 14);
          st.bub = null;
        }
      }
      if (st.ticks >= st.dur) toIdle();
      break;
    }

    case "sneeze": {
      const t_ = st.ticks;
      mouth = "o";
      if (t_ < 18) {
        eyes = "closed";
        sw = 1.06 + 0.02 * Math.sin(t_ * 0.9);
        jx = -1.2 * K * Math.sin(t_ * 0.9);
      } else {
        if (t_ === 18) {
          say("阿嚏！！", 20);
          for (let i = 0; i < 5; i++) {
            st.drops.push({ x: AX, y: AY - 65 * K, vx: rand(-3, 3) * K,
                            vy: rand(-4, -1.5) * K, life: 16 });
          }
        }
        if (t_ <= 26) { eyes = "closed"; bob = -22 * K * Math.sin((t_ - 18) / 8 * Math.PI); }
        else eyes = "happy";
      }
      if (t_ >= st.dur) toIdle();
      break;
    }

    case "watchyou":
      eyes = "open";
      st.facing = gp.x >= st.fx ? 1 : -1;
      if (st.ticks >= st.dur) startHop();   // 看够了就走
      break;

    case "sleepy":
      eyes = "closed";
      bob = Math.sin(st.total * 0.10) * 1.2 * K;
      if (st.ticks >= st.dur) {
        Object.assign(st, { state: "sleep", ticks: 0, sleep_t: 0,
          sleep_dur: randi(SLEEP_DUR[0], SLEEP_DUR[1]) });
        say("Z z z", 80);
      }
      break;

    case "sleep": {
      st.sleep_t += 1;
      eyes = "closed";
      bob = Math.sin(st.total * 0.06) * 1.2 * K;
      if (st.sleep_t % 90 === 0) say("Z z z", 80);
      const near = Math.abs(gp.x - st.fx) < 80 * K &&
                   (st.fy - 170 * K) < gp.y && gp.y < (st.fy + 15 * K);
      if (near) wakeUp(true);
      else if (st.sleep_t >= st.sleep_dur) wakeUp(false);
      break;
    }

    case "wake": mouth = "big"; sw = 0.98; sh = 1.04; if (st.ticks >= st.dur) toIdle(); break;

    case "celebrate": {
      const t_ = st.ticks;
      eyes = "happy"; mouth = "big";
      jx = 11 * K * Math.sin(t_ * 0.42);
      if (t_ < st.dur - 18) {
        bob = -16 * K * Math.abs(Math.sin(t_ * 0.5));
        if (t_ % 6 === 2) {
          spawnHeart();
          st.notes.push({ x: AX + rand(-30, 30) * K, y: AY - 130 * K,
            vx: rand(-0.6, 0.6), vy: -1.2, life: 30, size: pick([13, 16, 19]),
            ch: pick(["♪", "♫"]), col: "#ffb340" });
        }
      } else {
        const tt = (t_ - (st.dur - 18)) / 18;
        bob = -46 * K * Math.sin(Math.PI * Math.min(tt, 1));
        if (t_ === st.dur - 18) for (let i = 0; i < 3; i++) spawnHeart();
      }
      if (t_ >= st.dur) { say("", 0); toIdle(); }
      break;
    }

    default: toIdle();   // 未知状态兜底
  }

  st.eyes = eyes; st.mouth = mouth;
  st.sw = sw; st.sh = sh; st.bob = bob; st.jx = jx; st.ck = ck;
  updateGaze(eyes);
  applyPos();
  render();
  savePosIfMoved();
  checkClickThrough();
  checkMenuDismiss();
}

/* ---------------- 位置同步（窗口跟随锚点） ---------------- */
function applyPos() {
  const p = winPosFor(st.fx, st.fy);
  if (winX !== p.x || winY !== p.y) setWinPos(p.x, p.y);
  // 窗口可能被系统顶回屏内（macOS 不允许窗口高于菜单栏，实际 top 会停在菜单栏下方）：
  // 把「期望位置 − 宿主实际位置」的差额反向补到 #win 的窗口内偏移上——
  // 青蛙在屏幕上的位置因此不变，而窗口始终待在屏内，顶部也就贴得到了。
  if (realWinX === null || realWinY === null) return;
  const rangeX = WIN_MAX_W - WIN_W;
  const rangeY = WIN_MAX_H - WIN_H;
  // 下界允许为负：窗口被系统顶回时，#win 需要向上溢出窗口（裁掉的是 #win 上部的空白，
  // 青蛙本体仍完整可见）；最多溢出到「青蛙中心刚好贴住窗口上沿」。
  const minOffY = -(AY - Math.round(FROG_CENTER_DY * K));
  const offX = Math.round(clamp(rangeX / 2 - (realWinX - p.x), 0, rangeX));
  const offY = Math.round(clamp(rangeY / 2 - (realWinY - p.y), minOffY, rangeY));
  if (offX !== WIN_OFF_X || offY !== WIN_OFF_Y) {
    WIN_OFF_X = offX; WIN_OFF_Y = offY;
    winEl.style.left = offX + "px";
    winEl.style.top = offY + "px";
  }
}

/* =====================================================================
 * 渲染 —— 参数化 SVG，绘制顺序与 py paintEvent 一致：
 * frog → tongue → fly → bub → snore → bubble → notes → hearts → drops → stars
 * ===================================================================== */
const ctx2d = document.createElement("canvas").getContext("2d");
function textWidth(text, px) {
  ctx2d.font = `bold ${px}px "Microsoft YaHei UI", "Microsoft YaHei", sans-serif`;
  return ctx2d.measureText(text).width;
}
const FONT = `font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif"`;

function frogSvg() {
  // 身体部件（SVG_TMPL）—— 200×200 坐标系
  let eyes = "";
  for (const ex of [70, 130]) {
    eyes += `<circle cx="${ex}" cy="64" r="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="3"/>`;
    if (st.eyes === "open") {
      const px = ex + st.pogx, py = 64 + st.pogy;
      eyes += `<circle cx="${f2(px)}" cy="${f2(py)}" r="9" fill="#333333"/>`
            + `<circle cx="${f2(px + 1)}" cy="${f2(60 + st.pogy)}" r="3" fill="#ffffff"/>`;
    } else if (st.eyes === "wide") {
      const px = ex + st.pogx, py = 64 + st.pogy;
      eyes += `<circle cx="${f2(px)}" cy="${f2(py)}" r="12" fill="#333333"/>`
            + `<circle cx="${f2(px + 3)}" cy="${f2(60 + st.pogy)}" r="4" fill="#ffffff"/>`;
    } else if (st.eyes === "closed") {
      eyes += `<path d="M${ex - 13} 67 Q${ex} 74 ${ex + 13} 67" stroke="#4a7a3a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    } else if (st.eyes === "happy") {
      eyes += `<path d="M${ex - 13} 73 Q${ex} 57 ${ex + 13} 73" stroke="#4a7a3a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    } else { // dizzy
      eyes += `<path d="M${ex - 8} 56 L${ex + 8} 72 M${ex + 8} 56 L${ex - 8} 72" stroke="#333333" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    }
  }
  let mouth;
  if (st.mouth === "smile")
    mouth = `<path d="M82 116 Q100 132 118 116" stroke="#4a7a3a" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  else if (st.mouth === "big") mouth = `<path d="M82 117 Q100 137 118 117 Z" fill="#3f6d33"/>`;
  else if (st.mouth === "wavy")
    mouth = `<path d="M88 119 Q94 115 100 119 Q106 123 112 119" stroke="#4a7a3a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else if (st.mouth === "yawn") mouth = `<ellipse cx="100" cy="124" rx="12" ry="15" fill="#3f6d33"/>`;
  else mouth = `<ellipse cx="100" cy="122" rx="7" ry="9" fill="#3f6d33"/>`;

  const sa = f1(-20 + swing() * 0.5), sb = f1(20 + swing() * 0.5);
  const swg = f1(swing());
  const body =
    `<ellipse cx="100" cy="188" rx="76" ry="10" fill="#0a1d13" opacity="0.5"/>`
    + `<ellipse cx="100" cy="182" rx="72" ry="13" fill="#2f6b45"/>`
    + `<ellipse cx="100" cy="181" rx="60" ry="8" fill="#3c7d55"/>`
    + `<ellipse cx="100" cy="130" rx="62" ry="55" fill="#7ccb5e"/>`
    + `<ellipse cx="100" cy="150" rx="42" ry="32" fill="#d8f3c1"/>`
    + eyes + mouth
    + `<ellipse cx="56" cy="110" rx="${f1(11 * st.ck)}" ry="${f1(8 * st.ck)}" fill="#f4a8b0" opacity=".65"/>`
    + `<ellipse cx="144" cy="110" rx="${f1(11 * st.ck)}" ry="${f1(8 * st.ck)}" fill="#f4a8b0" opacity=".65"/>`
    + `<ellipse cx="62" cy="180" rx="20" ry="12" fill="#5aab41" transform="rotate(${sa} 62 180)"/>`
    + `<ellipse cx="138" cy="180" rx="20" ry="12" fill="#5aab41" transform="rotate(${sb} 138 180)"/>`
    + `<ellipse cx="72" cy="192" rx="24" ry="9" fill="#5aab41" transform="rotate(${swg} 72 192)"/>`
    + `<ellipse cx="128" cy="192" rx="24" ry="9" fill="#5aab41" transform="rotate(${swg} 128 192)"/>`;

  // 变换管线（py paintEvent）：translate(AX+dgx+jx, AY+bob+dgy-72k) → scale(S·sw, S·sh) → svg 中心对齐
  const tx = AX + st.dgx + st.jx;
  const ty = AY + st.bob + st.dgy - 72 * K;
  return `<g transform="translate(${f2(tx)} ${f2(ty)}) scale(${f2(S * st.sw)} ${f2(S * st.sh)}) translate(-100 -110)">${body}</g>`;
}

// py 里 swing 取的是成员变量，这里等价读取
function swing() { return st.swing; }

function fxSvg() {
  let s = "";
  // 舌头（blep / tongue）
  if (st.state === "blep") {
    const mx = AX + st.dgx + st.jx, my = AY + st.bob - 60 * K;
    const txp = mx + 5 * K, typ = my + 20 * K;
    s += `<line x1="${f2(mx)}" y1="${f2(my)}" x2="${f2(txp)}" y2="${f2(typ)}" stroke="#ff8fa8" stroke-width="${6 * K}" stroke-linecap="round"/>`
       + `<circle cx="${f2(txp)}" cy="${f2(typ)}" r="${5 * K}" fill="#ff7a9c"/>`;
  } else if (st.tongue) {
    const t = st.tongue;
    const mx = AX + st.dgx + st.jx, my = AY + st.bob + st.dgy - 65 * K;
    const tx0 = t.tx, ty0 = t.ty;
    let tt = Math.min(t.t, 1);
    if (t.phase === "back") tt = 1 - tt;
    const tipx = mx + (tx0 - mx) * tt, tipy = my + (ty0 - my) * tt;
    s += `<line x1="${f2(mx)}" y1="${f2(my)}" x2="${f2(tipx)}" y2="${f2(tipy)}" stroke="#ff8fa8" stroke-width="${6 * K}" stroke-linecap="round"/>`
       + `<circle cx="${f2(tipx)}" cy="${f2(tipy)}" r="${5 * K}" fill="#ff7a9c"/>`;
  }
  // 苍蝇
  if (st.fly) {
    const f = st.fly;
    let x = f.x, y = f.y;
    if (st.tongue && !f.flee) {
      const t = st.tongue;
      const mx = AX + st.dgx + st.jx, my = AY + st.bob + st.dgy - 65 * K;
      let tt = Math.min(t.t, 1);
      if (t.phase === "back") tt = 1 - tt;
      x = mx + (t.tx - mx) * tt; y = my + (t.ty - my) * tt;
    }
    const up = st.total % 2 === 0;
    const wy = y - 7 * K - (up ? 1 * K : 0);
    s += `<ellipse cx="${f2(x - 4 * K)}" cy="${f2(wy)}" rx="${f2(3.2 * K)}" ry="${f2(5.2 * K)}" fill="rgb(210,230,255)" opacity=".63"/>`
       + `<ellipse cx="${f2(x + 4 * K)}" cy="${f2(wy)}" rx="${f2(3.2 * K)}" ry="${f2(5.2 * K)}" fill="rgb(210,230,255)" opacity=".63"/>`
       + `<ellipse cx="${f2(x)}" cy="${f2(y)}" rx="${f2(4.5 * K)}" ry="${f2(3.4 * K)}" fill="#3a3a3a"/>`
       + `<ellipse cx="${f2(x + 4.5 * K)}" cy="${f2(y - 1 * K)}" rx="${f2(2.4 * K)}" ry="${f2(2.4 * K)}" fill="#3a3a3a"/>`;
  }
  // 吹泡泡
  if (st.bub) {
    const b = st.bub;
    const rr = (3 + 19 * Math.min(b.t / 40, 1)) * K;
    s += `<circle cx="${f2(b.x)}" cy="${f2(b.y)}" r="${f2(rr)}" fill="rgb(190,227,255)" fill-opacity=".2" stroke="#8ec9ff" stroke-width="2"/>`
       + `<circle cx="${f2(b.x - rr * 0.35)}" cy="${f2(b.y - rr * 0.35)}" r="${f2(rr * 0.22)}" fill="rgba(255,255,255,.5)"/>`;
  }
  // 鼾泡（sleepy/sleep）
  if (st.state === "sleepy" || st.state === "sleep") {
    const breath = Math.sin(st.total * (st.state === "sleepy" ? 0.10 : 0.06));
    const rr = (5 + 4 * (breath * 0.5 + 0.5)) * K;
    const nx = AX + st.dgx + st.jx + 6 * K;
    const ny = AY + st.bob + st.dgy - 73 * K;
    s += `<circle cx="${f2(nx)}" cy="${f2(ny)}" r="${f2(rr)}" fill="rgb(190,227,255)" fill-opacity=".27" stroke="#8ec9ff" stroke-width="2"/>`
       + `<circle cx="${f2(nx - rr * 0.3)}" cy="${f2(ny - rr * 0.3)}" r="${f2(rr * 0.25)}" fill="rgba(255,255,255,.55)"/>`;
  }
  // 对话气泡
  if (st.bubble_left > 0 && st.bubble_text) {
    const px = Math.max(10.67, 14.67 * K);
    const tw = textWidth(st.bubble_text, px);
    const bx = AX + st.facing * 8 * K, by = 40 * K;
    const x0 = bx - tw / 2 - 12 * K, y0 = by - 17 * K;
    const x1 = bx + tw / 2 + 12 * K, y1 = by + 17 * K;
    s += `<rect x="${f2(x0)}" y="${f2(y0)}" width="${f2(x1 - x0)}" height="${f2(y1 - y0)}" rx="${8 * K}" ry="${8 * K}" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/>`
       + `<path d="M${f2(AX - 8 * K)} ${f2(y1 - 2)} L${f2(AX)} ${f2(y1 + 12 * K)} L${f2(AX + 8 * K)} ${f2(y1 - 2)}" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" stroke-linejoin="round"/>`
       + `<text x="${f2(bx)}" y="${f2(by + px * 0.36)}" text-anchor="middle" ${FONT} font-size="${f2(px)}" font-weight="bold" fill="#333333">${st.bubble_text}</text>`;
  }
  // 音符
  for (const n of st.notes) {
    const px = Math.max(10.67, n.size * K * 1.333);
    s += `<text x="${f2(n.x)}" y="${f2(n.y)}" ${FONT} font-size="${f2(px)}" fill="${n.life > 8 ? n.col : "#ffd9a0"}">${n.ch}</text>`;
  }
  // 爱心
  for (const h of st.hearts) {
    const px = Math.max(10.67, h.size * K * 1.333);
    s += `<text x="${f2(h.x)}" y="${f2(h.y)}" ${FONT} font-size="${f2(px)}" fill="${h.life > 8 ? h.col : "#ffb3c0"}">${h.ch}</text>`;
  }
  // 水珠
  for (const d of st.drops) {
    s += `<circle cx="${f2(d.x)}" cy="${f2(d.y)}" r="${f2(2.6 * K)}" fill="rgb(150,205,255)" opacity=".78"/>`;
  }
  // 晕星星
  if (st.state === "dizzy") {
    let stars = "";
    for (let i = 0; i < 3; i++) {
      const ang = st.total * 0.12 + i * 2.094;
      const cx = AX + 48 * K * Math.cos(ang);
      const cy = (AY - 140 * K) + 12 * K * Math.sin(ang);
      let d = "";
      for (let k = 0; k < 8; k++) {
        const a = k * Math.PI / 4;
        const rr = (k % 2 === 0 ? 7 : 2.8) * K;
        const px2 = cx + rr * Math.cos(a), py2 = cy + rr * Math.sin(a);
        d += (k === 0 ? "M" : "L") + f2(px2) + " " + f2(py2) + " ";
      }
      stars += `<path d="${d}Z" fill="#ffce54"/>`;
    }
    s += stars;
  }
  return s;
}

function render() {
  sceneEl.innerHTML = frogSvg() + fxSvg();
}

/* =====================================================================
 * 交互 —— press/move/release 与 py 鼠标事件逐行对齐（统一 pointer 事件）
 * ===================================================================== */
winEl.addEventListener("pointerdown", e => {
  if (e.button === 2) return;            // 右键交给 contextmenu
  hideMenus();
  markAwake();
  if (st.state === "sleep" || st.state === "sleepy") { wakeUp(true); return; }
  if (e.button === 0) {
    st.grab = [gp.x, gp.y, winX, winY];
    st.moved = false;
    winEl.setPointerCapture(e.pointerId);
  }
});

winEl.addEventListener("pointermove", e => {
  if (!st.grab) return;
  const [gx, gy, wx0, wy0] = st.grab;
  const dx = gp.x - gx, dy = gp.y - gy;
  if (!st.moved && Math.abs(dx) + Math.abs(dy) > 6) {
    st.moved = true;
    st.state = "drag";
    st.ticks = 0;
    st.fly = null; st.tongue = null; st.bub = null; st.hop_intent = null;
    st.dgx = 0; st.dgy = 0;
  }
  if (st.moved && st.state === "drag") {
    const fx = clamp(wx0 + dx + WIN_MAX_W / 2, virt.l + PET_EDGE_MARGIN, virt.r - PET_EDGE_MARGIN);
    // fy 是「青蛙中心」：窗口中心与它重合，故直接用窗口半高反推
    const range = frogFyRange();
    const fy = clamp(wy0 + dy + WIN_MAX_H / 2, range.min, range.max);
    st.fx = fx; st.fy = fy;
    const p = winPosFor(fx, fy);
    setWinPos(p.x, p.y);
  }
});

winEl.addEventListener("pointerup", e => {
  if (e.button !== 0) return;
  if (st.state === "drag") finishDrag();
  else if (st.grab && !st.moved) {
    // 点一下宠物：顺手把收起的主窗口唤回来（宿主会先判断主窗口是不是真的关着，
    // 已开着就不会打扰）。主窗口收起时连 Dock 图标都隐藏，宠物是唯一入口。
    if (host && host.showMain) host.showMain();
    if (["idle", "croak", "land", "startle"].includes(st.state)) startHappy();
  }
  st.grab = null;
});

function finishDrag() {
  if (st.will_dizzy) Object.assign(st, { state: "dizzy", ticks: 0, dur: 40, shake: 0, will_dizzy: false });
  else Object.assign(st, { state: "land", ticks: 0, dur: 5 });
  markAwake();
  saveConfig();   // 拖到哪记到哪：下次启动回到这个位置
}

winEl.addEventListener("contextmenu", e => {
  e.preventDefault();
  showMainMenu(e.clientX, e.clientY);
});

/* =====================================================================
 * 右键菜单（青蛙皮肤 HTML 实现）
 * ===================================================================== */
const menuRoot = document.getElementById("menuRoot");
const menuInter = document.getElementById("menuInter");
const sizeRange = document.getElementById("sizeRange");
const sizePct = document.getElementById("sizePct");

function hideMenus() {
  menuRoot.style.display = "none";
  menuInter.style.display = "none";
  document.getElementById("miInter").classList.remove("open");
  menuWinOpen = false;
  menuAwayTicks = 0;
}

/* 菜单收起：光标离开菜单区域持续约 1.2 秒（30 帧）就收起。菜单展开期间窗口不再整块
 * 拦截鼠标（「点菜单外」的点击会穿到桌面），所以菜单靠这条规则自己收起，用户不必再点一次。 */
let menuAwayTicks = 0;
function checkMenuDismiss() {
  if (!menuWinOpen) { menuAwayTicks = 0; return; }
  if (!hostGp) return;
  const el = document.elementFromPoint(hostGp.x - winX, hostGp.y - winY);
  const inMenu = Boolean(el) && (menuRoot.contains(el) || menuInter.contains(el));
  if (inMenu) { menuAwayTicks = 0; return; }
  if (++menuAwayTicks >= 30) { menuAwayTicks = 0; hideMenus(); }   // 30 帧 ≈ 1.2s（留足移向菜单项的余量）
}

/* 宠物窗口的固定尺寸（与主进程 PET_WIN_W/H 一致）：窗口几何恒定后，缩放只改窗口内部，
 * 菜单、锚点、穿透都不再受缩放影响（也不必再为放菜单而临时放大窗口）。 */
const WIN_MAX_W = 560, WIN_MAX_H = 660;
/** 青蛙可贴到的屏幕边缘留白：只留一点点，让它能移动到屏幕的四个角
 *  （原先横向一律留 90px，导致永远到不了左右边缘）。 */
const PET_EDGE_MARGIN = 12;
/** 屏幕（虚拟桌面）范围换算到窗口内坐标。
 *  窗口可能与屏幕错开（宠物贴屏幕边缘时，窗口有一大半在屏幕外），
 *  菜单只能在窗口里渲染，所以必须同时约束在「屏幕内」与「窗口内」。 */
function screenRectInWindow() {
  // 菜单不能越到别的屏幕：用「归属屏」（宠物当前所在的那块屏，与自发动作同一套归属），
  // 而不是虚拟桌面并集 virt——否则第一块屏右侧的菜单会一路 clamp 到最右那块屏的边缘。
  const home = screenAt(st.fx);
  return { l: home.l - winX, t: home.t - winY, r: home.r - winX, b: home.b - winY };
}
/** 菜单在窗口内的可用区间（既要看得见，又不能超出窗口） */
function menuRoom(w, h) {
  const sr = screenRectInWindow();
  const minL = Math.max(4, sr.l + 4);
  const minT = Math.max(4, sr.t + 4);
  return {
    minL,
    maxL: Math.max(minL, Math.min(WIN_MAX_W - w - 4, sr.r - w - 4)),
    minT,
    maxT: Math.max(minT, Math.min(WIN_MAX_H - h - 4, sr.b - h - 4)),
  };
}
function placeMenu(x, y) {
  // 窗口尺寸恒定，但窗口位置不固定：菜单位置要 clamp 到「屏幕 ∩ 窗口」里，否则会跑到屏幕外
  const room = menuRoom(menuRoot.offsetWidth || 168, menuRoot.offsetHeight || 92);
  menuRoot.style.left = clamp(x, room.minL, room.maxL) + "px";
  menuRoot.style.top = clamp(y, room.minT, room.maxT) + "px";
  menuInter.style.display = "none";
}
function showMainMenu(x, y) {
  menuRoot.style.display = "block";
  menuWinOpen = true;
  placeMenu(x, y);
}
document.getElementById("miInter").addEventListener("mouseenter", () => {
  const r = menuRoot.getBoundingClientRect();
  menuInter.style.display = "block";
  menuInter.style.left = (r.right - 2) + "px";
  layoutSubMenu(r.top);
});

/** 二级菜单布局：默认与主菜单顶部对齐；下方空间不足时整体上移，保证它尽量完整可见。
 *  不能只按「剩余高度」设 maxHeight：放大到 200% 后鼠标能在更高的窗口里点得很靠下，
 *  那样二级菜单会被压成一条——用户看到的就是「菜单缩小了」。 */
/** 二级菜单布局：默认展开在主菜单右侧、与主菜单顶部对齐；右侧或下方空间不足时
 *  翻到左侧 / 整体上移（与原生菜单一致），保证菜单尽量完整可见。
 *  不能只按「剩余高度/宽度」裁剪：放大到 200% 后鼠标能在更大的窗口里点得很靠右/靠下，
 *  那样二级菜单会被压成一条或被裁掉一半——用户看到的就是「菜单缩小了」。 */
function layoutSubMenu(top) {
  const sr = screenRectInWindow();
  const m = menuRoot.getBoundingClientRect();
  menuInter.style.maxHeight = "none";
  const need = menuInter.scrollHeight + 14;   // 自身 padding(5×2) + border(2×2)
  const subW = menuInter.scrollWidth + 10;
  // 垂直：菜单高最多到「屏幕底 / 窗口底」中更靠上的那个
  const maxT = Math.max(8, Math.min(WIN_MAX_H - 8, sr.b - 8));
  const realH = Math.min(need, Math.max(120, maxT - 8));
  // 水平：按「屏幕内」的可用宽度决定方向。不能按窗口宽度(560)判断——
  // 主菜单在窗口中部时窗口右侧还剩两百多像素，但屏幕右侧可能已经没了；
  // 反之宠物贴屏幕右缘时窗口右半截在屏幕外，按窗口算会在屏幕外展开。
  const rightRoom = sr.r - 4 - (m.right - 2);
  const leftRoom = (m.left - 2) - (sr.l + 4);
  let left = m.right - 2;
  if (rightRoom < subW && leftRoom > rightRoom) left = m.left - subW + 2;
  const minL = Math.max(4, sr.l + 4);
  const maxL = Math.max(minL, Math.min(WIN_MAX_W - subW - 4, sr.r - subW - 4));
  menuInter.style.left = clamp(left, minL, maxL) + "px";
  menuInter.style.top = clamp(top, 8, Math.max(8, maxT - realH)) + "px";
  menuInter.style.maxHeight = Math.max(120, realH - 14) + "px";
  menuInter.style.overflowY = "auto";
}

/* 原「把窗口位移反向补偿到菜单上」的 shiftOpenMenus 已移除：
 * 窗口尺寸固定、位置也不随缩放变化，菜单无需任何补偿。 */
menuRoot.addEventListener("mouseleave", e => {
  if (!menuRoot.contains(e.relatedTarget) && !menuInter.contains(e.relatedTarget))
    setTimeout(() => { if (!menuInter.matches(":hover")) menuInter.style.display = "none"; }, 120);
});
menuInter.addEventListener("mouseleave", e => {
  if (!menuRoot.contains(e.relatedTarget)) menuInter.style.display = "none";
});
document.addEventListener("mousedown", e => {
  if (!menuRoot.contains(e.target) && !menuInter.contains(e.target)) hideMenus();
});

function applyScale(k) {
  K = clamp(k, 0.5, 2.0);
  applyGeometry();
  // 位置 clamp 不能跨屏：按宠物当前所在的那块屏幕（用户拖到哪块就归哪块）收尾
  const homeK = screenAt(st.fx);
  st.fx = clamp(st.fx, homeK.l + PET_EDGE_MARGIN, homeK.r - PET_EDGE_MARGIN);
  const range = frogFyRange();
  st.fy = clamp(st.fy, range.min, range.max);
  // 窗口尺寸固定、且窗口中心与青蛙中心重合（winPosFor 是常量偏移）：
  // 缩放不动窗口几何，菜单自然也纹丝不动。
  const p = winPosFor(st.fx, st.fy);
  setWinPos(p.x, p.y);
  saveConfig();
}
sizeRange.addEventListener("input", () => {
  const v = parseInt(sizeRange.value, 10);
  sizePct.textContent = v + "%";
  sizeRange.style.setProperty("--fill", ((v - 50) / 150 * 100) + "%");
  applyScale(v / 100);
});

// 二级菜单动作
menuInter.querySelectorAll(".mi[data-act]").forEach(el => {
  el.addEventListener("click", () => {
    ensureAwake();
    const a = el.dataset.act;
    if (a === "wander") toggleWander();
    else runAction(a);
    hideMenus();
  });
});
document.getElementById("miClose").addEventListener("click", () => {
  hideMenus();
  if (host && host.close) host.close();
  else { winEl.style.display = "none"; tip("呱呱已关闭（浏览器预览：刷新页面可唤回）", 0); }
});

/* ---------------- 预览提示 ---------------- */
const tipEl = document.getElementById("tip");
let tipTimer = null;
function tip(html, ms = 9000) {
  tipEl.innerHTML = html;
  tipEl.classList.remove("gone");
  clearTimeout(tipTimer);
  if (ms > 0) tipTimer = setTimeout(() => tipEl.classList.add("gone"), ms);
}

/* ---------------- 启动 ---------------- */
(function boot() {
  const cfg = loadConfig();
  st.wander = cfg.wander !== false;
  document.getElementById("miWander").textContent = "溜达：" + (st.wander ? "开" : "关");
  refreshScreens();
  // 初始位置：优先用上次记住的位置（clamp 回当前虚拟屏内），否则主屏右下角
  // （py: 锚点 fx=SW-230, fy=SH-60，窗口=锚点-AX/AY）
  const savedPos = cfg && cfg.pos;
  const anchor = {
    minFy: virt.t + Math.round(AY - FROG_CENTER_DY * K),
    maxFy: virt.b - Math.round(FROG_CENTER_DY * K),
  };
  if (savedPos && isFinite(savedPos.x) && isFinite(savedPos.y)) {
    st.fx = clamp(savedPos.x, virt.l + PET_EDGE_MARGIN, virt.r - PET_EDGE_MARGIN);
    st.fy = clamp(savedPos.y, anchor.minFy, anchor.maxFy);
  } else {
    // 虚拟桌面右下角：直接用 virt.r / virt.b，不能用「宽度 - 230」——
    // virt.l/virt.t 非 0（副屏在左/上）时那个差值会落到屏幕外。
    // 脚底距屏幕底 60px（fy 存的是中心，故减去中心偏移）。
    st.fx = virt.r - 230; st.fy = virt.b - 60 - FROG_CENTER_DY * K;
  }
  {
    const p0 = winPosFor(st.fx, st.fy);
    setWinPos(p0.x, p0.y);
  }
  lastSavedPos = { x: Math.round(st.fx), y: Math.round(st.fy) };
  st.sleep_after = randi(SLEEP_AFTER[0], SLEEP_AFTER[1]);
  st.sleep_dur = randi(SLEEP_DUR[0], SLEEP_DUR[1]);
  sizeRange.value = Math.round(K * 100);
  sizePct.textContent = Math.round(K * 100) + "%";
  sizeRange.style.setProperty("--fill", ((K * 100 - 50) / 150 * 100) + "%");
  setInterval(tick, TICK);
  // 对话完成：主窗口经宿主转发 → 从动作池里随机挑一个
  if (host && host.onCelebrate) host.onCelebrate(() => startRandomCelebrate());
  if (!host) {
    tip("🐸 浏览器预览模式（页面即虚拟屏幕）<br>左键点一下=开心跳 · 按住拖动=拎起来甩 · 光标凑脸=吓一跳 · 在肚皮上来回蹭=挠痒痒 · 右键=菜单", 12000);
  }
  render();
})();
