# 固定 registry 走 npmjs 官方源 (防御性, 主机制是 CI install 步骤里的 BUN_CONFIG_REGISTRY 环境变量)
# 注意: 这个 bunfig.toml 只影响在 packages/desktop 目录下直接执行的 bun install;
# 根目录的 `bun install` (monorepo workspace 安装) 不读这里的配置,
# 所以 CI 流水线里必须在 install 步骤显式带 BUN_CONFIG_REGISTRY=https://registry.npmjs.org/。
[install]
registry = "https://registry.npmjs.org/"
