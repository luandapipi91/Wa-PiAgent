# wa-pi CI 门禁流水线 (Gitee Go)
#
# Schema 参考: https://help.gitee.com/gitee-go/
# 字段名(triggers / stages / steps / GITEE_ENV_PATH) 以 Gitee Go 平台实际接受为准；
# 推送到 Gitee 后在流水线编辑器里确认一次。
name: wa-pi-ci
displayName: CI 门禁
triggers:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
stages:
  - name: check
    steps:
      - step: script
        name: install-bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITEE_ENV_PATH
      - step: script
        name: deps
        # 固定走 npmjs 官方源；npmmirror 国内 CI 曾出现 systray2 tarball 损坏
        run: BUN_CONFIG_REGISTRY=https://registry.npmjs.org/ bun install --frozen-lockfile
      - step: script
        name: typecheck
        run: bun run typecheck
      - step: script
        name: test
        run: bun run test
