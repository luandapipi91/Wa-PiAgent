[package]
name = "hiagent"
version = "0.0.0"
edition = "2021"

# lib 名与 main.rs 的 hiagent_lib::run() 对齐（Tauri 2 官方模板约定）
[lib]
name = "hiagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
# tokio 只用 time::sleep + sync::mpsc，走 tauri async_runtime（已含 tokio），但显式声明避免靠传递依赖
tokio = { version = "1", features = ["time", "sync", "rt"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
